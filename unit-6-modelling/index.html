<!doctype html>

<title>Unit 6 Mathematical Modelling Review</title>
<style>
:root{--ink:#18222d;--muted:#66717b;--line:#d8d1c6;--paper:#fffaf1;--accent:#174a7c;--good:#14532d;--warn:#854d0e;--bad:#7f1d1d;--shadow:0 18px 50px rgba(23,32,42,.15)}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#111;color:var(--ink);overflow:hidden}.deck{width:100vw;height:100vh;position:relative;background:radial-gradient(circle at 20% 0,#fffdf8 0,#f7f4ed 46%,#ece5d7 100%)}.slide{position:absolute;inset:0;padding:4.7vh 6vw 10vh;display:none;overflow:auto}.slide.active{display:flex;flex-direction:column}.center{align-items:center;justify-content:center;text-align:center}.slide h1{font-size:clamp(40px,6vw,84px);line-height:.95;margin:0 0 20px;letter-spacing:-.035em}.slide h2{font-size:clamp(30px,4.15vw,58px);line-height:1;margin:0 0 20px;letter-spacing:-.025em}.slide h3{font-size:clamp(20px,2vw,31px);margin:0 0 10px}.slide p,.slide li{font-size:clamp(17px,1.4vw,25px);line-height:1.34}.small{font-size:clamp(14px,1vw,19px)!important;color:var(--muted)}.kicker{font-size:clamp(20px,2.1vw,32px);color:var(--accent);font-weight:800}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:rgba(255,250,241,.97);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.eq{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:clamp(22px,1.82vw,32px);line-height:1.5;letter-spacing:.005em}.eq.smallEq{font-size:clamp(19px,1.5vw,27px)}.eqblock{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 16px;margin:12px 0;text-align:center}.var{font-style:italic}.unit{font-family:Inter,system-ui,sans-serif;font-style:normal;font-size:.82em;color:var(--muted);white-space:nowrap}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 .08em}.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .15em .06em}.frac>span:last-child{padding:.06em .15em 0}.data{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:clamp(14px,1.06vw,20px);line-height:1.5;white-space:pre-wrap}.question{font-size:clamp(17px,1.3vw,23px);line-height:1.38}.callout{border-left:5px solid var(--accent);padding:9px 14px;background:rgba(23,74,124,.07);border-radius:0 12px 12px 0}.nav{position:fixed;right:20px;bottom:16px;display:flex;gap:9px;align-items:center;z-index:50}.nav button,.btn{border:0;border-radius:999px;background:#17202a;color:white;padding:11px 17px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.15)}.nav button.secondary,.btn.secondary{background:white;color:#17202a;border:1px solid var(--line)}.btn.alt{background:var(--accent)}.btn.help{background:var(--bad)}.counter{background:rgba(255,255,255,.84);border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-weight:800}.progress{position:fixed;left:0;bottom:0;height:5px;background:var(--accent);z-index:51;transition:width .2s}.choice{background:#fff;border:2px solid var(--line);border-radius:15px;padding:12px 15px;font-weight:850;cursor:pointer;font-size:clamp(15px,1.12vw,20px)}.choice.selected{border-color:var(--accent);background:#e8f1fa}.routeChoices{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 18px}.overlay{position:fixed;inset:0;background:rgba(14,19,24,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:4vh 4vw}.overlay.open{display:flex}.modal{width:min(1020px,94vw);max-height:92vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 32px 85px rgba(0,0,0,.34)}.modal h2{font-size:clamp(28px,3.5vw,48px);margin:0 0 10px}.modal p,.modal li{font-size:clamp(16px,1.28vw,22px);line-height:1.38}.modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.badge{display:inline-block;background:#e8f1fa;color:#174a7c;border-radius:999px;padding:7px 12px;font-weight:850;margin:4px}.support{border-left:7px solid var(--bad)}.stretch{border-left:7px solid var(--good)}.consolidate{border-left:7px solid var(--warn)}.routeTag{font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-size:14px}.bigNum{font-size:clamp(44px,7.5vw,105px);font-weight:900;color:var(--accent);line-height:.9}.step{opacity:0;transform:translateY(8px);max-height:0;overflow:hidden;transition:opacity .2s,transform .2s,max-height .25s}.step.shown{opacity:1;transform:none;max-height:720px}.tapHint{position:absolute;left:6vw;bottom:20px;color:var(--muted);font-size:14px;font-weight:700}.required{font-weight:900}.optional{color:var(--muted)}details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}summary{cursor:pointer;font-weight:850}@media(max-width:800px){.slide{padding:4vh 5vw 11vh}.grid2,.grid3{grid-template-columns:1fr}.slide p,.slide li{font-size:17px}.data{font-size:13px}.modal{padding:19px}.nav{right:10px;bottom:10px}.nav button{padding:10px 12px}.eq{font-size:21px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div><div class="progress" id="progress"></div><div class="nav"><button class="secondary" id="prevBtn">Back</button><span class="counter" id="counter"></span><button id="nextBtn">Next</button></div><div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<script>
const deck=document.getElementById('deck'),progress=document.getElementById('progress'),counter=document.getElementById('counter'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),overlay=document.getElementById('overlay'),modal=document.getElementById('modal');
const routeState={};let current=0,strandAcc=null;const slides=[];
const s=(title,body)=>slides.push([title,`<section class="slide">${body}</section>`]);
const sc=(title,body)=>slides.push([title,`<section class="slide center">${body}</section>`]);
const step=t=>`<div class="step">${t}</div>`;
const eq=t=>`<div class="eqblock"><div class="eq">${t}</div></div>`;
sc('Unit 6 Mathematical Modelling','<h1>Unit 6<br>Mathematical Modelling</h1><div class="kicker">SL review</div><p>Use models. Interpret them. Decide when to trust them.</p><p class="small">Test: Thursday 20 August</p>');
s('How today’s review works','<h2>How today’s review works</h2><div class="card"><p class="eq"><b>TRY → CONFIDENCE → REVIEW → TRY AGAIN → CHECK → CHOOSE YOUR ROUTE</b></p><div class="grid2"><div><h3>Before the solution</h3><p><b>1</b> — Mostly guessing<br><b>2</b> — I have an approach but I am not sure<br><b>3</b> — I am confident and could explain my reasoning</p></div><div><h3>After the answer check</h3><p><b>CORRECT / PARTLY CORRECT / INCORRECT</b></p><p>Accuracy + your earlier confidence suggests the practice route.</p></div></div><p class="small">Your teacher controls the common lesson sequence. Personal practice routes never lock you away from the class.</p></div>');
s('What could appear','<h2>What could appear</h2><div class="grid2"><div class="card"><h3>SL model families used in this unit</h3><p>linear<br>quadratic<br>cubic<br>exponential<br>direct / inverse variation<br>sinusoidal</p></div><div class="card"><h3>SL modelling decisions</h3><p>choose a plausible model<br>find parameters from given information<br>interpret parameters and predictions<br>state a reasonable domain<br>judge appropriateness and limitations<br>recognise interpolation and extrapolation</p></div></div>');
s('Cycle 1 — TRY','<h2>Cycle 1 — Use and interpret a model</h2><div class="grid2"><div class="card"><p>A second-hand laptop loses resale value. Let <span class="eq"><span class="var">t</span></span> be age in months and <span class="eq"><span class="var">V</span>(<span class="var">t</span>)</span> be value in RM.</p><pre class="data">t (months):        0     4     8     12     16     20\nV (RM):         1290  1120   955    820    700    605</pre><p>A proposed model is</p>'+eq('<span class="var">V</span>(<span class="var">t</span>) = 1296(0.9625)<sup><span class="var">t</span></sup>')+'</div><div class="card"><p class="question">a) Explain why an exponential model is plausible from the pattern and context.<br><br>b) Interpret <b>1296</b> and <b>0.9625</b> in context.<br><br>c) Estimate when the value first falls below RM750.<br><br>d) Predict the value at 28 months.<br><br>e) How much trust would you place in part (d)? Explain.</p></div></div>');
sc('Cycle 1 confidence','<h2>Confidence check</h2><p>Record confidence <b>before</b> seeing the worked review.</p><div class="grid3" style="width:90%"><button class="card choice" onclick="setPreConfidence(\'c1\',1,this)"><div class="bigNum">1</div><p>Mostly guessing</p></button><button class="card choice" onclick="setPreConfidence(\'c1\',2,this)"><div class="bigNum">2</div><p>I have an approach but I am not sure</p></button><button class="card choice" onclick="setPreConfidence(\'c1\',3,this)"><div class="bigNum">3</div><p>I am confident and could explain it</p></button></div>');
s('Cycle 1 — REVIEW','<h2>Cycle 1 — Worked review</h2><div class="card"><p><b>Why exponential?</b> The value is decreasing, and the decreases are better described as roughly multiplicative than as a constant amount each month.</p>'+step(eq('<span class="var">V</span>(<span class="var">t</span>) = 1296(0.9625)<sup><span class="var">t</span></sup>')+'<p><b>1296</b> is the modelled value at <span class="eq"><span class="var">t</span>=0</span>. The multiplier <b>0.9625</b> means the model keeps 96.25% of its value each month: a decrease of about <b>3.75% per month</b>.</p>')+step('<p>For the RM750 threshold, solve</p>'+eq('1296(0.9625)<sup><span class="var">t</span></sup> = 750')+'<p>Technology gives <span class="eq"><span class="var">t</span>≈14.3</span>. So the value falls below RM750 just after about <b>14.3 months</b>.</p>')+step(eq('<span class="var">V</span>(28) ≈ 445')+'<p>The model predicts a resale value of about <b>RM445</b> at 28 months.</p>')+step('<div class="callout"><b>But:</b> the observed data stop at 20 months. A 28-month prediction is <b>extrapolation</b>, so it should be treated cautiously.</div>')+'</div><div class="tapHint">Next reveals one piece of reasoning at a time.</div>');
s('Cycle 1 — TRY AGAIN','<h2>Cycle 1 — Try again</h2><div class="grid2"><div class="card"><p>A fountain jet is modelled by</p>'+eq('<span class="var">h</span>(<span class="var">x</span>) = −0.2357<span class="var">x</span><sup>2</sup> + 1.8857<span class="var">x</span> + 0.5786')+'<p><span class="eq"><span class="var">x</span></span> is horizontal distance and <span class="eq"><span class="var">h</span>(<span class="var">x</span>)</span> is height, both in metres. Measurements were taken only for <span class="eq">0≤<span class="var">x</span>≤6</span>.</p></div><div class="card"><p class="question">a) Explain why a quadratic model makes sense for the shape of the jet.<br><br>b) Estimate the maximum height and where it occurs.<br><br>c) The water lands when the height is zero. Estimate the positive value of <span class="eq"><span class="var">x</span></span> for which <span class="eq"><span class="var">h</span>(<span class="var">x</span>)=0</span>.<br><br>d) Is that landing estimate interpolation or extrapolation?</p></div></div>');
s('Cycle 1 — CHECK + CHOOSE',`<h2>Cycle 1 — Check</h2><div class="grid2"><div class="card"><h3>Check your mathematics</h3><p>A downward-opening quadratic matches a path that rises to one maximum and then falls.</p>${eq('maximum ≈ 4.35 <span class="unit">m</span> &nbsp; at &nbsp; <span class="var">x</span>≈4.00 <span class="unit">m</span>')}${eq('<span class="var">h</span>(<span class="var">x</span>)=0 &nbsp; → &nbsp; positive root <span class="var">x</span>≈8.30 <span class="unit">m</span>')}<p>Because <span class="eq">8.30&gt;6</span>, the landing estimate is <b>extrapolation</b>.</p></div><div class="card">${routeBlock('c1')}</div></div>`);
s('Cycle 2 — TRY','<h2>Cycle 2 — Variation + sinusoidal modelling</h2><div class="grid2"><div class="card"><h3>A. Survey drones</h3><p>The time <span class="eq"><span class="var">T</span></span> minutes to map a fixed area varies inversely with the number of identical drones <span class="eq"><span class="var">n</span></span>. Six drones take 45 minutes.</p><p class="question">i) Find a model for <span class="eq"><span class="var">T</span></span> in terms of <span class="eq"><span class="var">n</span></span>.<br>ii) Predict the time with 10 drones.<br>iii) Give a sensible domain if at most 12 drones are available.</p></div><div class="card"><h3>B. Tide height</h3><p>High tide is 5.8 m and low tide is 1.4 m. At <span class="eq"><span class="var">t</span>=0</span> the tide is at a maximum. The next maximum is 12.4 h later.</p><p class="question">i) Find a cosine model for the height <span class="eq"><span class="var">H</span>(<span class="var">t</span>)</span>.<br>ii) Estimate the height after 5 h.<br>iii) During the first 12.4 h, when is the height 2.0 m?</p></div></div>');
s('Cycle 2 confidence','<h2>Confidence check</h2><p>Record the two strands separately before seeing the worked review.</p><div class="grid2"><div class="card"><h3>VARIATION</h3><div class="routeChoices"><button class="choice" onclick="setPreConfidence(\'variation\',1,this)">1 — Mostly guessing</button><button class="choice" onclick="setPreConfidence(\'variation\',2,this)">2 — Not sure</button><button class="choice" onclick="setPreConfidence(\'variation\',3,this)">3 — Confident</button></div></div><div class="card"><h3>SINUSOIDAL MODELLING</h3><div class="routeChoices"><button class="choice" onclick="setPreConfidence(\'sinusoidal\',1,this)">1 — Mostly guessing</button><button class="choice" onclick="setPreConfidence(\'sinusoidal\',2,this)">2 — Not sure</button><button class="choice" onclick="setPreConfidence(\'sinusoidal\',3,this)">3 — Confident</button></div></div></div>');
s('Cycle 2 — REVIEW','<h2>Cycle 2 — Worked review</h2><div class="grid2"><div class="card"><h3>A. Inverse variation</h3><p>Inverse variation means the <b>product</b> stays constant.</p>'+step(eq('<span class="var">nT</span> = <span class="var">k</span>'))+step(eq('6×45 = 270 &nbsp; → &nbsp; <span class="var">T</span>(<span class="var">n</span>) = <span class="frac"><span>270</span><span><span class="var">n</span></span></span>'))+step(eq('<span class="var">T</span>(10)=<span class="frac"><span>270</span><span>10</span></span>=27 <span class="unit">min</span>'))+step('<p>The number of drones must be a positive whole number, and at most 12 are available.</p>'+eq('<span class="var">n</span>∈{1,2,3,…,12}'))+'</div><div class="card"><h3>B. Sinusoidal model</h3><p>Use the maximum, minimum and period first.</p>'+step(eq('amplitude = <span class="frac"><span>5.8−1.4</span><span>2</span></span> = 2.2')+eq('principal axis: &nbsp; <span class="var">H</span>=<span class="frac"><span>5.8+1.4</span><span>2</span></span>=3.6'))+step(eq('period = 12.4 <span class="unit">h</span> &nbsp; → &nbsp; <span class="var">b</span>=<span class="frac"><span>360°</span><span>12.4</span></span>≈29.03')+'<p class="small">Use degree mode. Here <span class="eq"><span class="var">b</span>≈29.03°</span> per hour.</p>')+step(eq('<span class="var">H</span>(<span class="var">t</span>) = 2.2 cos(29.03<span class="var">t</span>) + 3.6'))+step(eq('<span class="var">H</span>(5)≈1.79 <span class="unit">m</span>')+eq('<span class="var">H</span>(<span class="var">t</span>)=2 &nbsp; → &nbsp; <span class="var">t</span>≈4.71 <span class="unit">h</span>,&nbsp;7.69 <span class="unit">h</span>'))+'</div></div><div class="tapHint">Next reveals one decision at a time.</div>');
s('Cycle 2 — TRY AGAIN','<h2>Cycle 2 — Try again</h2><div class="grid2"><div class="card"><h3>A. Resin printing</h3><p>The mass of resin <span class="eq"><span class="var">R</span></span> grams varies directly with the number of identical parts <span class="eq"><span class="var">p</span></span>. Eighteen parts use 306 g.</p><p class="question">i) Find a model for <span class="eq"><span class="var">R</span>(<span class="var">p</span>)</span>.<br>ii) Find the resin needed for 25 parts.<br>iii) State a sensible domain for <span class="eq"><span class="var">p</span></span>.</p></div><div class="card"><h3>B. Daylight</h3><p>Daylight varies from 10.2 h to 13.8 h with a period of 365 days. At <span class="eq"><span class="var">t</span>=0</span>, daylight is on the principal axis and <b>increasing</b>.</p><p class="question">i) Find a sine model <span class="eq"><span class="var">D</span>(<span class="var">t</span>)</span>.<br>ii) Estimate the daylight after 60 days.<br>iii) During the first 365 days, when is the daylight 13.0 h?</p><p class="small">Use degree mode.</p></div></div>');
s('Cycle 2 — CHECK + CHOOSE','<h2>Cycle 2 — Check</h2><div class="grid2"><div class="card"><h3>A. Direct variation</h3>'+eq('<span class="var">R</span>(<span class="var">p</span>)=17<span class="var">p</span>')+eq('<span class="var">R</span>(25)=425 <span class="unit">g</span>')+'<p>A sensible domain is positive whole-number values of <span class="eq"><span class="var">p</span></span> allowed by the context.</p><h3 style="margin-top:18px">B. Sinusoidal</h3>'+eq('<span class="var">D</span>(<span class="var">t</span>) = 1.8 sin(0.9863<span class="var">t</span>) + 12')+eq('<span class="var">D</span>(60)≈13.55 <span class="unit">h</span>')+eq('<span class="var">D</span>(<span class="var">t</span>)=13 &nbsp; → &nbsp; <span class="var">t</span>≈34.2,&nbsp;148.3 <span class="unit">days</span>')+'</div><div class="card"><h3>Choose each strand separately</h3><p>You can be secure in one strand and still need support in the other.</p><button class="btn alt" onclick="openStrand(\'variation\')">Variation route</button><br><br><button class="btn alt" onclick="openStrand(\'sinusoidal\')">Sinusoidal route</button><div id="strandStatus" class="small" style="margin-top:16px"></div></div></div>');
s('Cycle 3 — TRY','<h2>Cycle 3 — Judge two proposed models</h2><div class="grid2"><div class="card"><p>A support team records unresolved tickets after a software launch.</p><pre class="data">Week, t:      0    1    2    3    4    5    6\nTickets:     520  430  360  310  270  240  215</pre><p>Two models have been proposed:</p>'+eq('<span class="var">Q</span>(<span class="var">t</span>) = 6.488<span class="var">t</span><sup>2</sup> − 88.393<span class="var">t</span> + 515.833')+eq('<span class="var">E</span>(<span class="var">t</span>) = 497.534(0.8637)<sup><span class="var">t</span></sup>')+'</div><div class="card"><p class="question">a) Calculate <span class="eq"><span class="var">Q</span>(0)</span>, <span class="eq"><span class="var">E</span>(0)</span>, <span class="eq"><span class="var">Q</span>(6)</span> and <span class="eq"><span class="var">E</span>(6)</span>. Compare them with the observed data.<br><br>b) Examine what each model does after week 6.<br><br>c) Which model would you prefer for a week-8 estimate? Explain.<br><br>d) Compare the week-12 predictions. Should either be trusted without qualification?<br><br>e) State one assumption or limitation.</p></div></div>');
sc('Cycle 3 confidence','<h2>Confidence check</h2><p>Record confidence in your <b>modelling judgement</b> before seeing the worked review.</p><div class="grid3" style="width:90%"><button class="card choice" onclick="setPreConfidence(\'c3\',1,this)"><div class="bigNum">1</div><p>Mostly guessing</p></button><button class="card choice" onclick="setPreConfidence(\'c3\',2,this)"><div class="bigNum">2</div><p>I have a reason but I am not sure</p></button><button class="card choice" onclick="setPreConfidence(\'c3\',3,this)"><div class="bigNum">3</div><p>I could defend my judgement</p></button></div>');
s('Cycle 3 — REVIEW','<h2>Cycle 3 — Worked review</h2><div class="grid2"><div class="card"><h3>1. Compare with observed values</h3>'+eq('<span class="var">Q</span>(0)≈516,&nbsp; <span class="var">E</span>(0)≈498 &nbsp; <span class="unit">(observed 520)</span>')+eq('<span class="var">Q</span>(6)≈219,&nbsp; <span class="var">E</span>(6)≈207 &nbsp; <span class="unit">(observed 215)</span>')+'<p>Both are reasonably close at these points. This alone is not enough to decide which model should be extrapolated.</p>'+step('<h3>2. Examine behaviour</h3><p>The quadratic reaches a minimum near week 6.8 and then turns upward. The exponential continues to decrease.</p>')+step(eq('<span class="var">Q</span>(8)≈224,&nbsp; <span class="var">E</span>(8)≈154')+'<p>If unresolved tickets are expected to keep falling for a short time, the exponential behaviour may be more plausible for week 8.</p>')+'</div><div class="card"><h3>3. Look further ahead</h3>'+step(eq('<span class="var">Q</span>(12)≈389,&nbsp; <span class="var">E</span>(12)≈86')+'<p>Week 12 is far outside the observed interval, and the two models now disagree strongly.</p>')+step('<h3>4. Make a modelling judgement</h3><p>Neither prediction should be treated as automatically reliable. State a reasonable domain, explain the assumptions, and <b>refine the model when new data arrive</b>.</p><div class="callout">A model can fit the known situation and still behave poorly outside the interval where it was developed.</div>')+'</div></div><div class="tapHint">Next reveals the evidence behind the judgement.</div>');
s('Cycle 3 — TRY AGAIN','<h2>Cycle 3 — Try again</h2><div class="grid2"><div class="card"><p>Light intensity below a lake has been measured only for depths <span class="eq">0≤<span class="var">d</span>≤5</span> metres. Two models are proposed for possible extension beyond that interval:</p>'+eq('<span class="var">Q</span>(<span class="var">d</span>) = 1.9<span class="var">d</span><sup>2</sup> − 25.3<span class="var">d</span> + 98.8')+eq('<span class="var">E</span>(<span class="var">d</span>) = 100.4(0.76)<sup><span class="var">d</span></sup>')+'</div><div class="card"><p class="question">a) Calculate each model’s prediction at depths 8 m and 15 m.<br><br>b) If there is no new underwater light source, compare the long-term behaviour of the two models.<br><br>c) Which model would you be more willing to use for a <b>short</b> extrapolation? Explain.<br><br>d) State a sensible restriction or limitation for each model.</p></div></div>');
s('Cycle 3 — CHECK + CHOOSE',`<h2>Cycle 3 — Check</h2><div class="grid2"><div class="card"><h3>Check the predictions</h3>${eq('<span class="var">d</span>=8: &nbsp; <span class="var">Q</span>(8)=18.0,&nbsp; <span class="var">E</span>(8)≈11.17')}${eq('<span class="var">d</span>=15: &nbsp; <span class="var">Q</span>(15)=146.8,&nbsp; <span class="var">E</span>(15)≈1.64')}<p>The quadratic eventually turns upward, predicting increasing light at greater depth. With no new light source, that behaviour is difficult to justify.</p><p>The exponential remains positive and decreases, so it may be more plausible for short extrapolation — but it should still be restricted because the observed data stop at 5 m.</p></div><div class="card">${routeBlock('c3')}</div></div>`);
s('Independent readiness check','<h2>Independent readiness check</h2><div class="grid2"><div class="card"><p><b>No hints.</b></p><p>A climbing centre records weekly bookings after opening.</p><pre class="data">Week, t:       0    1    2    3    4    5    6\nBookings:      84  112  134  148  154  150  138</pre><p>A proposed short-term model is</p>'+eq('<span class="var">B</span>(<span class="var">t</span>) = −4.119<span class="var">t</span><sup>2</sup> + 33.929<span class="var">t</span> + 83.190')+'</div><div class="card"><p class="question">a) Explain why a quadratic model is plausible from the pattern.<br><br>b) Estimate the maximum weekly bookings and when it occurs.<br><br>c) Solve <span class="eq"><span class="var">B</span>(<span class="var">t</span>)=120</span> and interpret the relevant solutions.<br><br>d) Predict the number of bookings at week 8.<br><br>e) How much trust would you place in that prediction?<br><br>f) Give a reasonable contextual domain and one limitation.</p></div></div>');
s('Readiness check — solution','<h2>Readiness check — solution</h2><div class="grid2"><div class="card"><h3>1. Justify</h3><p>The observed bookings rise, reach one peak, then begin to fall. Over this short interval, that shape is consistent with a downward-opening quadratic.</p>'+step('<h3>2. Maximum</h3>'+eq('maximum at <span class="var">t</span>≈4.12 <span class="unit">weeks</span>,&nbsp; <span class="var">B</span>≈153 <span class="unit">bookings</span>'))+step('<h3>3. Solve and interpret</h3>'+eq('<span class="var">B</span>(<span class="var">t</span>)=120 &nbsp; → &nbsp; <span class="var">t</span>≈1.29,&nbsp;6.95')+'<p>The model predicts about 120 bookings once while bookings are rising and again while they are falling.</p>')+'</div><div class="card"><h3>4. Predict</h3>'+step(eq('<span class="var">B</span>(8)≈91 <span class="unit">bookings</span>'))+step('<h3>5. Judge</h3><p>Week 8 is outside the observed 0–6 week interval, so this is extrapolation. A short extrapolation may be useful, but launch conditions may change.</p><p>A defensible domain should be <b>short-term and contextual</b>; do not extend the parabola indefinitely.</p>')+'</div></div><div class="tapHint">Next reveals the solution in stages.</div>');
sc('Thursday Readiness','<h2>Thursday readiness</h2><div class="card" style="width:min(900px,92vw);text-align:left"><p>Before you finish, identify:</p><p><b>1.</b> One area I am secure in:<br>____________________________</p><p><b>2.</b> One mathematical skill I should practise before Thursday:<br>____________________________</p><p><b>3.</b> My most useful practice route today:<br><b>SUPPORT / CONSOLIDATE / STRETCH</b></p><p class="small">Test: Thursday 20 August</p></div>');
function routeBlock(id){return `<h3>How accurate was your response?</h3><div class="routeChoices"><button class="choice" onclick="setAccuracy('${id}','correct',this)">CORRECT</button><button class="choice" onclick="setAccuracy('${id}','partly',this)">PARTLY CORRECT</button><button class="choice" onclick="setAccuracy('${id}','incorrect',this)">INCORRECT</button></div><p class="small"><b>Confidence recorded before the answer:</b> <span id="stored-${id}">not recorded</span></p>`}
function render(){deck.innerHTML=slides.map((x,i)=>x[1].replace('<section class="slide','<section class="slide'+(i===current?' active':''))).join('');counter.textContent=`${current+1} / ${slides.length}`;progress.style.width=((current+1)/slides.length*100)+'%';['c1','c3'].forEach(id=>{const e=document.getElementById('stored-'+id);if(e)e.textContent=confidenceLabel(routeState[id]?.level)});updateStrandStatus()}
function visibleSteps(){return [...document.querySelectorAll('.slide.active .step:not(.shown)')]}
function next(){if(overlay.classList.contains('open'))return;const hidden=visibleSteps();if(hidden.length){hidden[0].classList.add('shown');return}if(current<slides.length-1){current++;render()}}
function prev(){closeOverlay();if(current>0){current--;render()}}
prevBtn.onclick=prev;nextBtn.onclick=next;document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft'){e.preventDefault();prev()}if(e.key==='Escape')closeOverlay()});
function setPreConfidence(id,level,el){routeState[id]=routeState[id]||{};routeState[id].level=level;const parent=el.closest('.card')||el.parentElement;parent.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));el.classList.add('selected')}
function confidenceLabel(level){return level===3?'3 — CONFIDENT':level===2?'2 — NOT SURE':level===1?'1 — MOSTLY GUESSING':'NOT RECORDED'}
function confidenceBand(level){return level===3?'confident':'not confident'}
function mapped(a,level){const c=confidenceBand(level);if(a==='correct'&&c==='confident')return'stretch';if(a==='correct'||a==='partly')return'consolidate';if(a==='incorrect'&&c==='not confident')return'support';return'misconception'}
function setAccuracy(id,a,el){el.parentElement.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');const r=mapped(a,routeState[id]?.level);id==='c1'?showC1(r):showC3(r)}
function panel(tag,klass,body,ready,action){modal.innerHTML=`<div class="routeTag">${tag}</div><div class="card ${klass}">${body}</div><div class="modal-actions"><button class="btn secondary" onclick="closeOverlay()">RETURN TO LESSON</button><button class="btn help" onclick="openHelp()">I NEED HELP</button><button class="btn alt" onclick="${action}">${ready}</button></div>`;openOverlay()}
function practice(req,opt){return `<p><span class="badge required">Required: ${req}</span></p><p class="optional">If you finish and still have time: ${opt}</p>`}
function showC1(r){if(r==='stretch')panel('STRETCH','stretch','<h2>Stretch</h2><p>You were accurate and confident. Try one modelling-judgement question independently.</p>'+practice('Hodder 13F Q5','Q6'),'READY FOR CYCLE 2','goTo("Cycle 2 — TRY")');else if(r==='consolidate')panel('CONSOLIDATE','consolidate','<h2>Consolidate</h2><p>Practise choosing and using a model once more.</p>'+practice('Hodder 13F Q1','Q2'),'READY FOR CYCLE 2','goTo("Cycle 2 — TRY")');else if(r==='support')panel('SUPPORT','support',supportC1(),'READY FOR CYCLE 2','goTo("Cycle 2 — TRY")');else panel('MISCONCEPTION CHECK','support','<h2>Misconception check</h2><p><b>When the water lands, which equation should you solve?</b></p><p>Landing means the height is zero, so solve <span class="eq"><span class="var">h</span>(<span class="var">x</span>)=0</span>.</p>'+supportC1(),'READY FOR CYCLE 2','goTo("Cycle 2 — TRY")')}
function supportC1(){return '<h2>Support — one more model</h2><p>A school café records the morning outdoor temperature <span class="eq"><span class="var">T</span></span> in °C and the number of hot drinks sold that morning, <span class="eq"><span class="var">D</span>(<span class="var">T</span>)</span>. For mornings with temperatures from 12°C to 24°C, the café uses the model</p><div class="eqblock"><div class="eq"><span class="var">D</span>(<span class="var">T</span>)=−4<span class="var">T</span>+166</div></div><p><b>1.</b> What does the gradient −4 mean in context?<br><b>2.</b> Predict the number of hot drinks sold when <span class="eq"><span class="var">T</span>=23°C</span>.<br><b>3.</b> Would you trust the model at 35°C? Explain using the observed temperature interval.</p><details><summary>Reveal check</summary><p>The model predicts about 4 fewer hot drinks for each 1°C increase in morning temperature; <span class="eq"><span class="var">D</span>(23)=74</span> drinks; 35°C is outside the observed 12–24°C interval, so it is extrapolation and should be treated cautiously.</p></details>'+practice('Hodder 13F Q1','Q2')}
function openStrand(strand){const level=routeState[strand]?.level;modal.innerHTML=`<h2>${strand==='variation'?'Variation':'Sinusoidal modelling'}</h2><p>How accurate was your response?</p><div class="routeChoices"><button class="choice" onclick="strandAcc='correct';markChoice(this)">CORRECT</button><button class="choice" onclick="strandAcc='partly';markChoice(this)">PARTLY CORRECT</button><button class="choice" onclick="strandAcc='incorrect';markChoice(this)">INCORRECT</button></div><p class="small"><b>Stored confidence:</b> ${confidenceLabel(level)}</p><div class="modal-actions"><button class="btn alt" onclick="openStrandRoute('${strand}')">OPEN MY ROUTE</button><button class="btn secondary" onclick="closeOverlay()">RETURN TO LESSON</button></div>`;strandAcc=null;openOverlay()}
function markChoice(el){el.parentElement.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));el.classList.add('selected')}
function openStrandRoute(strand){if(!strandAcc)return;const r=mapped(strandAcc,routeState[strand]?.level);strand==='variation'?showVariation(r):showSinusoidal(r)}
function finishStrand(s){routeState[s]=routeState[s]||{};routeState[s].done=true;closeOverlay();updateStrandStatus()}
function updateStrandStatus(){const e=document.getElementById('strandStatus');if(e)e.innerHTML=`Variation: ${routeState.variation?.done?'ready':'not marked ready'}<br>Sinusoidal: ${routeState.sinusoidal?.done?'ready':'not marked ready'}`}
function showVariation(r){if(r==='stretch')panel('VARIATION STRETCH','stretch','<h2>Variation — stretch</h2><p>Use a harder contextual variation question.</p>'+practice('Hodder 13D Q16','Q17'),'MARK VARIATION READY','finishStrand("variation")');else if(r==='consolidate')panel('VARIATION CONSOLIDATE','consolidate','<h2>Variation — consolidate</h2><p>Direct variation: <span class="eq"><span class="frac"><span><span class="var">y</span></span><span><span class="var">x</span></span></span></span> is constant. Inverse variation: <span class="eq"><span class="var">xy</span></span> is constant.</p>'+practice('Hodder 13D Q9','Q12'),'MARK VARIATION READY','finishStrand("variation")');else panel(r==='support'?'VARIATION SUPPORT':'VARIATION MISCONCEPTION','support','<h2>Variation — support</h2><p>A team of identical survey drones maps the same fixed area. Let <span class="eq"><span class="var">n</span></span> be the number of drones and <span class="eq"><span class="var">T</span>(<span class="var">n</span>)</span> be the time in minutes. The time varies inversely with the number of drones. Six drones take 45 minutes.</p><div class="eqblock"><div class="eq">6×45=270 &nbsp; → &nbsp; <span class="var">T</span>(<span class="var">n</span>)=<span class="frac"><span>270</span><span><span class="var">n</span></span></span></div></div><p><b>1.</b> Find the mapping time if 9 drones are used.<br><b>2.</b> Explain why <span class="eq"><span class="var">n</span>=0</span> is not in the contextual domain.</p><details><summary>Reveal check</summary><p><span class="eq"><span class="var">T</span>(9)=30</span> min; <span class="eq"><span class="var">n</span></span> counts drones, so it must be a positive whole number. With zero drones the area cannot be mapped using this model.</p></details>'+practice('Hodder 13D Q9','Q12'),'MARK VARIATION READY','finishStrand("variation")')}
function showSinusoidal(r){if(r==='stretch')panel('SINUSOIDAL STRETCH','stretch','<h2>Sinusoidal — stretch</h2><p>Use a more contextual sinusoidal question.</p>'+practice('Hodder 13E Q8','Q9'),'MARK SINUSOIDAL READY','finishStrand("sinusoidal")');else if(r==='consolidate')panel('SINUSOIDAL CONSOLIDATE','consolidate','<h2>Sinusoidal — consolidate</h2><p>Find maximum, minimum, amplitude, principal axis and period before writing the model.</p>'+practice('Hodder 13E Q5','Q6'),'MARK SINUSOIDAL READY','finishStrand("sinusoidal")');else panel(r==='support'?'SINUSOIDAL SUPPORT':'SINUSOIDAL MISCONCEPTION','support','<h2>Support — build the model</h2><p>The volume of water in a storage tank changes periodically during an 8-hour pump cycle. Let <span class="eq"><span class="var">V</span>(<span class="var">t</span>)</span> be the volume in litres, where <span class="eq"><span class="var">t</span></span> is time in hours after the cycle begins. The maximum volume is 920 L, the minimum is 280 L, the period is 8 h, and the tank is at its maximum at <span class="eq"><span class="var">t</span>=0</span>.</p><div class="eqblock"><div class="eq">amplitude = ____<br>principal axis = ____<br><span class="var">b</span>=<span class="frac"><span>360°</span><span>8</span></span>=____<br><span class="var">V</span>(<span class="var">t</span>)=____ cos(____<span class="var">t</span>)+____</div></div><p>After building the model, estimate the volume after 3 hours.</p><details><summary>Reveal check</summary><p>Amplitude 320 L; principal axis 600 L; <span class="eq"><span class="var">b</span>=45</span>; <span class="eq"><span class="var">V</span>(<span class="var">t</span>)=320cos(45<span class="var">t</span>)+600</span>; <span class="eq"><span class="var">V</span>(3)≈373.7</span> L.</p></details>'+practice('Hodder 13E Q5','Q6'),'MARK SINUSOIDAL READY','finishStrand("sinusoidal")')}
function showC3(r){if(r==='stretch')panel('STRETCH','stretch','<h2>Stretch</h2><p>Push the modelling judgement further.</p>'+practice('Hodder 13F Q5','Q6'),'READY FOR FINAL CHECK','goTo("Independent readiness check")');else if(r==='consolidate')panel('CONSOLIDATE','consolidate','<h2>Consolidate</h2><p>Check behaviour, contextual domain, extrapolation and limitations.</p>'+practice('Hodder 13F Q1','Q2'),'READY FOR FINAL CHECK','goTo("Independent readiness check")');else panel(r==='support'?'SUPPORT':'MISCONCEPTION CHECK','support','<h2>Support — judge the model</h2><p>A hot drink is initially 82°C and is left in a room at a constant 22°C. Let <span class="eq"><span class="var">t</span></span> be time in minutes and let the model output be the drink temperature in °C. Using measurements from only the first 20 minutes, two simple models are proposed:</p><div class="eqblock"><div class="eq"><span class="var">L</span>(<span class="var">t</span>)=82−1.8<span class="var">t</span><br><span class="var">E</span>(<span class="var">t</span>)=82(0.976)<sup><span class="var">t</span></sup></div></div><p><b>1.</b> What does each model predict as <span class="eq"><span class="var">t</span></span> becomes very large?<br><b>2.</b> Why does the room temperature of 22°C show that neither model is suitable indefinitely?<br><b>3.</b> What restriction would you place on using these models?</p><details><summary>Reveal check</summary><p>The linear model eventually predicts negative temperatures; the exponential approaches 0°C. Physically, the drink should approach the room temperature of 22°C, not continue below it. Both models should therefore be restricted to a short interval close to the observed first 20 minutes and refined for longer-term predictions.</p></details>'+practice('Hodder 13F Q5','Q6'),'READY FOR FINAL CHECK','goTo("Independent readiness check")')}
function openHelp(){modal.innerHTML='<div class="routeTag">SUPPORT</div><div class="card support"><h2>I need help</h2><p>Ask yourself:</p><ol><li>What quantities are changing, and what are their units?</li><li>What type of relationship or graph behaviour is present?</li><li>What value am I actually solving for?</li><li>What does the numerical answer mean in context?</li><li>Is the prediction inside or outside the observed interval?</li></ol></div><div class="modal-actions"><button class="btn alt" onclick="closeOverlay()">RETURN TO LESSON</button></div>';openOverlay()}
function openOverlay(){overlay.classList.add('open')}
function closeOverlay(){overlay.classList.remove('open')}
function goTo(title){const i=slides.findIndex(x=>x[0]===title);if(i>=0)current=i;closeOverlay();render()}
render();
</script>
</body>
</html>

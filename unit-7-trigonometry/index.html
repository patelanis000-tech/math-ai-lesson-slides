<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 7.1 — Right-Angled Trigonometry</title>
<style>
:root{--ink:#18222d;--muted:#66717b;--line:#d8d1c6;--paper:#fffaf1;--accent:#174a7c;--good:#14532d;--warn:#854d0e;--shadow:0 18px 50px rgba(23,32,42,.15)}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#111;color:var(--ink);overflow:hidden}.deck{width:100vw;height:100vh;position:relative;background:radial-gradient(circle at 20% 0,#fffdf8 0,#f7f4ed 46%,#ece5d7 100%)}.slide{position:absolute;inset:0;padding:4.7vh 6vw 10vh;display:none;overflow:auto}.slide.active{display:flex;flex-direction:column}.slide h1{font-size:clamp(40px,6vw,84px);line-height:.95;margin:0 0 20px;letter-spacing:-.035em}.slide h2{font-size:clamp(30px,4.15vw,58px);line-height:1;margin:0 0 20px;letter-spacing:-.025em}.slide h3{font-size:clamp(20px,2vw,31px);margin:0 0 10px}.slide p,.slide li{font-size:clamp(17px,1.4vw,25px);line-height:1.34}.small{font-size:clamp(14px,1vw,19px)!important;color:var(--muted)}.kicker{font-size:clamp(20px,2.1vw,32px);color:var(--accent);font-weight:800}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:rgba(255,250,241,.97);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.eq{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:clamp(22px,1.82vw,32px);line-height:1.5}.eqblock{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 16px;margin:12px 0;text-align:center}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 .08em}.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .15em .06em}.frac>span:last-child{padding:.06em .15em 0}.callout{border-left:5px solid var(--accent);padding:9px 14px;background:rgba(23,74,124,.07);border-radius:0 12px 12px 0}.challenge{border-left:5px solid var(--warn);padding:9px 14px;background:rgba(133,77,14,.07);border-radius:0 12px 12px 0}.answer{border-left:5px solid var(--good);padding:9px 14px;background:rgba(20,83,45,.07);border-radius:0 12px 12px 0}.nav{position:fixed;right:20px;bottom:16px;display:flex;gap:9px;align-items:center;z-index:50}.nav button{border:0;border-radius:999px;background:#17202a;color:white;padding:11px 17px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.15)}.nav button.secondary{background:white;color:#17202a;border:1px solid var(--line)}.counter{background:rgba(255,255,255,.84);border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-weight:800}.progress{position:fixed;left:0;bottom:0;height:5px;background:var(--accent);z-index:51;transition:width .2s}.step{opacity:0;transform:translateY(8px);max-height:0;overflow:hidden;transition:opacity .2s,transform .2s,max-height .25s}.step.shown{opacity:1;transform:none;max-height:900px}.tip{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;margin:10px 0}.tip b{display:grid;place-items:center;background:#17202a;color:white;border-radius:50%;width:34px;height:34px}.timer{font-size:clamp(52px,8vw,118px);font-weight:900;color:var(--accent);line-height:.9;margin:14px 0}.timerBtns{display:flex;gap:10px;flex-wrap:wrap}.timerBtns button{border:0;border-radius:999px;background:#17202a;color:#fff;padding:10px 16px;font-weight:800;cursor:pointer}.timerBtns button.alt{background:#fff;color:#17202a;border:1px solid var(--line)}svg{width:100%;height:auto;max-height:56vh}.lab{font:700 22px Inter,system-ui,sans-serif;fill:#18222d}.labsm{font:650 18px Inter,system-ui,sans-serif;fill:#18222d}.tapHint{position:absolute;left:6vw;bottom:20px;color:var(--muted);font-size:14px;font-weight:700}@media(max-width:800px){.slide{padding:4vh 5vw 11vh}.grid2,.grid3{grid-template-columns:1fr}.slide p,.slide li{font-size:17px}.nav{right:10px;bottom:10px}.nav button{padding:10px 12px}svg{max-height:40vh}}
</style>
</head>
<body>
<div class="deck" id="deck"></div><div class="progress" id="progress"></div><div class="nav"><button class="secondary" id="prevBtn">Back</button><span class="counter" id="counter"></span><button id="nextBtn">Next</button></div>
<script>
const deck=document.getElementById('deck'),progress=document.getElementById('progress'),counter=document.getElementById('counter'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');let current=0;const slides=[];const s=(title,body)=>slides.push([title,`<section class="slide">${body}</section>`]);const step=t=>`<div class="step">${t}</div>`;const eq=t=>`<div class="eqblock"><div class="eq">${t}</div></div>`;

s('Mind map — Trigonometry',`<div class="kicker">Unit 7 · Trigonometric Reasoning</div><div class="grid2"><div><h1>Mind map:<br>Trigonometry</h1><p class="small">Blank A3 · landscape · from memory first</p><div class="timer" id="timer">15:00</div><div class="timerBtns"><button onclick="startTimer(event)">Start</button><button class="alt" onclick="pauseTimer(event)">Pause</button><button class="alt" onclick="resetTimer(event)">Reset</button></div></div><div class="card"><div class="tip"><b>1</b><p><strong>Retrieve first.</strong> Put down what you remember before organising it.</p></div><div class="tip"><b>2</b><p>Use <strong>keywords, symbols, formulae and tiny diagrams</strong> — not paragraphs.</p></div><div class="tip"><b>3</b><p>Build <strong>meaningful branches</strong>. Reorganise if a better structure appears.</p></div><div class="tip"><b>4</b><p>Draw <strong>cross-links</strong>. Label the arrow with <em>why</em> the ideas connect.</p></div><div class="tip"><b>5</b><p>Mark uncertainty with <strong>?</strong> and leave space to revise the map later.</p></div><p class="small">Don’t decorate it. Make your thinking visible.</p></div></div>`);

s('Why do trig ratios exist?',`<div class="kicker">From similarity to trigonometry</div><h2>Same angle. Different size. Same ratios.</h2><div class="grid2"><div class="card"><svg viewBox="0 0 700 430"><g transform="translate(40 350)"><path d="M0 0 L180 0 L180 -135 Z" fill="none" stroke="#18222d" stroke-width="4"/><path d="M160 0 L160 -20 L180 -20" fill="none" stroke="#18222d" stroke-width="3"/><text x="72" y="30" class="labsm">4</text><text x="190" y="-60" class="labsm">3</text><text x="75" y="-72" class="labsm">5</text><text x="12" y="-10" class="labsm">36.9°</text></g><g transform="translate(340 350)"><path d="M0 0 L240 0 L240 -180 Z" fill="none" stroke="#66717b" stroke-width="4"/><path d="M218 0 L218 -22 L240 -22" fill="none" stroke="#66717b" stroke-width="3"/><text x="105" y="30" class="labsm">8</text><text x="250" y="-82" class="labsm">6</text><text x="106" y="-95" class="labsm">10</text><text x="12" y="-10" class="labsm">36.9°</text></g></svg></div><div class="card"><p><strong>Calculate for both triangles:</strong></p>${eq(`<span class="frac"><span>opposite</span><span>hypotenuse</span></span> &nbsp;&nbsp; <span class="frac"><span>adjacent</span><span>hypotenuse</span></span> &nbsp;&nbsp; <span class="frac"><span>opposite</span><span>adjacent</span></span>`)}${step(`<div class="answer"><p><strong>They stay the same.</strong> Scaling the triangle changes the side lengths, but the angle fixes the ratios.</p></div>`)}</div></div><div class="tapHint">Next reveals the idea.</div>`);

s('Right-triangle language',`<div class="kicker">The toolkit</div><h2>The side names depend on the angle you choose.</h2><div class="grid2"><div class="card"><svg viewBox="0 0 700 470"><path d="M100 385 L570 385 L570 95 Z" fill="none" stroke="#18222d" stroke-width="5"/><path d="M540 385 L540 355 L570 355" fill="none" stroke="#18222d" stroke-width="4"/><path d="M130 385 A55 55 0 0 1 165 340" fill="none" stroke="#66717b" stroke-width="4"/><text x="145" y="360" class="lab">θ</text><text x="300" y="425" class="lab">adjacent</text><text x="585" y="250" class="lab">opposite</text><text x="300" y="215" class="lab" transform="rotate(-31 300 215)">hypotenuse</text></svg></div><div class="card">${eq(`sin θ = <span class="frac"><span>opposite</span><span>hypotenuse</span></span>`)}${eq(`cos θ = <span class="frac"><span>adjacent</span><span>hypotenuse</span></span>`)}${eq(`tan θ = <span class="frac"><span>opposite</span><span>adjacent</span></span>`)}<div class="callout"><p><strong>Decision:</strong> What do I know? What do I want? Which relationship contains both?</p></div>${step(`<p><strong>Calculator check:</strong> degrees today. Direct trig finds a side; inverse trig finds an angle.</p>`)}</div></div>`);

s('Sides and angles',`<div class="kicker">Fast examples</div><h2>Direct trig → side. Inverse trig → angle.</h2><div class="grid2"><div class="card"><h3>A · Find a side</h3><svg viewBox="0 0 520 270"><path d="M65 220 L420 220 L420 75 Z" fill="none" stroke="#18222d" stroke-width="4"/><path d="M396 220 L396 196 L420 196" fill="none" stroke="#18222d" stroke-width="3"/><text x="95" y="203" class="labsm">34°</text><text x="220" y="250" class="labsm">12.4 cm</text><text x="235" y="120" class="labsm">h = ?</text></svg>${step(`<div class="answer">${eq(`cos 34° = 12.4 / h &nbsp; → &nbsp; h ≈ 15.0 cm`)}</div>`)}</div><div class="card"><h3>B · Find an angle</h3><svg viewBox="0 0 520 270"><path d="M65 220 L420 220 L420 72 Z" fill="none" stroke="#18222d" stroke-width="4"/><path d="M396 220 L396 196 L420 196" fill="none" stroke="#18222d" stroke-width="3"/><text x="105" y="203" class="labsm">θ</text><text x="205" y="250" class="labsm">10.5</text><text x="438" y="155" class="labsm">7.2</text></svg>${step(`<div class="answer">${eq(`tan θ = 7.2 / 10.5 &nbsp; → &nbsp; θ ≈ 34.4°`)}</div>`)}</div></div>`);

s('Rapid check',`<div class="kicker">8 minutes maximum</div><h2>Four questions. Draw or annotate before calculating.</h2><div class="grid2"><div class="card"><p><strong>1.</strong> Hypotenuse 18 cm; acute angle 42°. Find the opposite side.</p><p><strong>2.</strong> Adjacent = 9.6 m, hypotenuse = 15.1 m. Find the acute angle.</p></div><div class="card"><p><strong>3.</strong> A rectangle is 8.4 m by 11.2 m. Find its diagonal, then the angle the diagonal makes with the 11.2 m side.</p><p><strong>4.</strong> A cliff is 62 m high. The angle of depression to a boat is 18°. Find the horizontal distance from the cliff.</p></div></div>${step(`<div class="answer"><p><strong>Answers:</strong> 1) 12.0 cm &nbsp; 2) 50.5° &nbsp; 3) 14.0 m and 36.9° &nbsp; 4) about 191 m</p></div>`)}`);

s('Picture → model',`<div class="kicker">Representation before calculation</div><h2>What mathematics is hiding in this scene?</h2><div class="grid2"><div class="card"><svg viewBox="0 0 760 500"><rect x="515" y="95" width="155" height="320" rx="4" fill="#d8d1c6" stroke="#18222d" stroke-width="3"/><g fill="#fff" stroke="#9aa0a6"><rect x="545" y="125" width="36" height="45"/><rect x="603" y="125" width="36" height="45"/><rect x="545" y="195" width="36" height="45"/><rect x="603" y="195" width="36" height="45"/><rect x="545" y="265" width="36" height="45"/><rect x="603" y="265" width="36" height="45"/></g><line x1="55" y1="415" x2="705" y2="415" stroke="#66717b" stroke-width="3"/><circle cx="130" cy="329" r="17" fill="#18222d"/><line x1="130" y1="346" x2="130" y2="392" stroke="#18222d" stroke-width="8"/><line x1="130" y1="360" x2="105" y2="382" stroke="#18222d" stroke-width="6"/><line x1="130" y1="360" x2="155" y2="382" stroke="#18222d" stroke-width="6"/><line x1="145" y1="330" x2="590" y2="95" stroke="#18222d" stroke-width="3" stroke-dasharray="9 8"/><line x1="145" y1="330" x2="515" y2="330" stroke="#66717b" stroke-width="2" stroke-dasharray="7 7"/><text x="194" y="315" class="labsm">41°</text><text x="300" y="448" class="labsm">28 m</text><text x="55" y="302" class="labsm">eye level 1.70 m</text></svg></div><div class="card"><h3>Estimate the building height.</h3><ol><li>Draw the mathematical model.</li><li>Name the vertical quantity your trig calculation actually finds.</li><li>Choose the relationship and calculate.</li><li>State a sensible final answer.</li></ol>${step(`<div class="answer">${eq(`rise = 28 tan 41° ≈ 24.3 m`)}${eq(`height ≈ 24.3 + 1.70 = 26.0 m`)}</div>`)}</div></div>`);

s('Two viewpoints',`<div class="kicker">Harder picture model</div><h2>One tower. Two viewpoints. One unknown distance.</h2><div class="grid2"><div class="card"><svg viewBox="0 0 820 500"><rect x="650" y="80" width="80" height="335" fill="#d8d1c6" stroke="#18222d" stroke-width="3"/><line x1="55" y1="415" x2="760" y2="415" stroke="#66717b" stroke-width="3"/><circle cx="300" cy="350" r="10" fill="#18222d"/><circle cx="150" cy="350" r="10" fill="#18222d"/><line x1="300" y1="350" x2="690" y2="80" stroke="#18222d" stroke-width="3"/><line x1="150" y1="350" x2="690" y2="80" stroke="#66717b" stroke-width="3"/><line x1="150" y1="350" x2="650" y2="350" stroke="#aaa" stroke-width="2" stroke-dasharray="7 7"/><text x="315" y="339" class="labsm">47°</text><text x="170" y="339" class="labsm">31°</text><text x="200" y="448" class="labsm">18 m</text><text x="128" y="390" class="labsm">B</text><text x="278" y="390" class="labsm">A</text><text x="505" y="448" class="labsm">A → tower = x</text></svg></div><div class="card"><h3>Camera height = 1.60 m. Find the tower height.</h3><p><strong>Restriction:</strong> do not invent the distance from A to the tower. Call it <em>x</em>.</p>${step(`<div class="challenge"><p><strong>Hint:</strong> both sight lines reach the same vertical rise <em>h</em>.</p></div>`)}${step(eq(`tan 47° = h/x &nbsp;&nbsp;&nbsp; tan 31° = h/(x+18)`))}${step(`<div class="answer"><p><strong>Result:</strong> x ≈ 22.9 m, rise h ≈ 24.6 m, tower height ≈ <strong>26.2 m</strong>.</p></div>`)}</div></div>`);

s('Prime tomorrow',`<div class="kicker">No new rules yet</div><h2>What if the triangle is not right-angled?</h2><div class="grid2"><div class="card"><svg viewBox="0 0 700 470"><path d="M95 390 L610 390 L385 80 Z" fill="none" stroke="#18222d" stroke-width="5"/><line x1="385" y1="80" x2="385" y2="390" stroke="#66717b" stroke-width="4" stroke-dasharray="8 7"/><path d="M385 365 L410 365 L410 390" fill="none" stroke="#66717b" stroke-width="3"/><text x="80" y="420" class="lab">A</text><text x="615" y="420" class="lab">B</text><text x="385" y="60" class="lab">C</text><text x="212" y="205" class="lab">b</text><text x="512" y="225" class="lab">a</text><text x="338" y="425" class="lab">c</text><text x="405" y="225" class="lab">h</text></svg></div><div class="card"><h3>You may add exactly one line.</h3><p>Using only today’s right-triangle mathematics:</p><ol><li>Write <em>h</em> in two different ways.</li><li>What relationship follows?</li><li>Use area = ½ × base × height. Can you remove <em>h</em>?</li></ol><div class="challenge"><p><strong>Stretch:</strong> do not name a new rule. Derive it.</p></div></div></div>`);

s('Derivation challenge',`<div class="kicker">For students who are ready</div><h2>How much can right-triangle trig generate?</h2><div class="grid3"><div class="card"><h3>1 · Shared height</h3>${eq(`h = b sin A`)}${eq(`h = a sin B`)}${step(`<div class="answer">${eq(`b sin A = a sin B`)}</div>`)}</div><div class="card"><h3>2 · Area</h3>${eq(`Area = ½ × c × h`)}<p>Replace <em>h</em> using a right triangle.</p>${step(`<div class="answer">${eq(`Area = ½bc sin A`)}</div>`)}</div><div class="card"><h3>3 · Three sides + one angle</h3>${eq(`x = b cos A`)}<p>Use Pythagoras twice. Eliminate <em>x</em> and <em>h</em>.</p>${step(`<div class="answer">${eq(`a² = b² + c² − 2bc cos A`)}</div>`)}</div></div><p class="small">Tomorrow we formalise what you have just started to derive.</p>`);

s('Exit',`<div class="kicker">Individual check</div><h2>Model it without being handed a triangle.</h2><div class="grid2"><div class="card"><p>A cable runs from the top of a vertical mast to a point 14.0 m from its base. The cable is 22.0 m long.</p><p><strong>a)</strong> Find the mast height.</p><p><strong>b)</strong> Find the angle the cable makes with the horizontal.</p><p><strong>c)</strong> Sketch one way today’s ideas could help with a triangle that has <em>no</em> right angle.</p>${step(`<div class="answer"><p><strong>Check:</strong> mast ≈ 17.0 m; angle ≈ 50.5°.</p></div>`)}</div><div class="card"><h3>Return to your mind map</h3><ul><li>Correct one thing.</li><li>Add three important ideas.</li><li>Add two <strong>labelled cross-links</strong>.</li><li>Circle one idea that you think will matter tomorrow.</li></ul></div></div>`);

slides.forEach(x=>deck.insertAdjacentHTML('beforeend',x[1]));const nodes=[...document.querySelectorAll('.slide')];function show(n){current=Math.max(0,Math.min(n,nodes.length-1));nodes.forEach((el,i)=>el.classList.toggle('active',i===current));counter.textContent=`${current+1} / ${nodes.length}`;progress.style.width=`${((current+1)/nodes.length)*100}%`;window.scrollTo(0,0)}function reveal(){const x=nodes[current].querySelector('.step:not(.shown)');if(x){x.classList.add('shown');return true}return false}function next(){if(!reveal())show(current+1)}function prev(){show(current-1)}nextBtn.onclick=next;prevBtn.onclick=prev;document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();next()}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}if(e.code==='Space'){e.preventDefault();reveal()}if(e.key==='Home')show(0);if(e.key==='End')show(nodes.length-1)});show(0);
let seconds=900,timerHandle=null;function drawTimer(){const el=document.getElementById('timer');if(!el)return;const m=Math.floor(seconds/60),s=seconds%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function startTimer(e){e&&e.stopPropagation();if(timerHandle)return;timerHandle=setInterval(()=>{seconds=Math.max(0,seconds-1);drawTimer();if(seconds===0)pauseTimer()},1000)}function pauseTimer(e){e&&e.stopPropagation();clearInterval(timerHandle);timerHandle=null}function resetTimer(e){e&&e.stopPropagation();pauseTimer();seconds=900;drawTimer()}drawTimer();
</script>
</body>
</html>
